name: mcpp Build

# Developing HuxerUI and its applications with mcpp.
#
# CMake remains the full-platform path and the only path for Android, iOS and
# Web; this workflow covers what mcpp builds today. The design is
# docs/design/mcpp-build-system.md.
#
# `parity` is first and cheap on purpose: it builds two small programs and no
# framework, so the failure it catches -- a source added to one build system
# and not the other -- is reported before anyone waits on a compile.

on:
  push:
    branches: [main]
    paths:
      # WHAT THIS BUILD ACTUALLY READS, and nothing else. Every entry below is
      # an input to `mcpp build`, `mcpp test` or the parity check; a change
      # anywhere else cannot alter the result, and running an hour of five
      # platforms to prove that is waste.
      #
      # The `!` line is last on purpose: in a paths filter a later pattern
      # overrides an earlier one, so it subtracts documentation from every
      # directory named above. README.md under mcpp/, include/ or
      # mcpp/examples/ is not a build input.
      - 'mcpp.toml'
      - 'build.mcpp'
      - 'mcpp/**'
      # The library itself, its public headers and the resources hrc compiles.
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'platform/linux/**'
      - 'platform/windows/**'
      - 'platform/macos/**'
      - 'platform/android/**'
      - 'platform/ios/**'
      - 'platform/web/**'
      - 'resources/**'
      # Read by huxerui-build-check, which compares the two build systems.
      - 'cmake/platform/**'
      - 'cmake/HuxerUIBuild.cmake'
      - 'tools/codegen/**'
      - 'tools/resource_compiler/**'
      # Compiled by mcpp/huxerui-tests: the suite, what it links beside it, and
      # the vendored Catch2. Without these a change to a unit test would not run
      # the suite that compiles it.
      - 'tests/unit/**'
      - 'tests/support/**'
      - 'examples/buffer_reference/**'
      - '3dparty/catch2/**'
      # The generated-app job builds the CLI and instantiates every template,
      # so those trees are inputs to this workflow as much as the framework is.
      - 'templates/**'
      - 'tools/huxerui_cli/**'
      - 'tests/cli/**'
      - '.github/workflows/mcpp-build.yml'
      - '!**.[mM][dD]'
  pull_request:
    paths:
      # WHAT THIS BUILD ACTUALLY READS, and nothing else. Every entry below is
      # an input to `mcpp build`, `mcpp test` or the parity check; a change
      # anywhere else cannot alter the result, and running an hour of five
      # platforms to prove that is waste.
      #
      # The `!` line is last on purpose: in a paths filter a later pattern
      # overrides an earlier one, so it subtracts documentation from every
      # directory named above. README.md under mcpp/, include/ or
      # mcpp/examples/ is not a build input.
      - 'mcpp.toml'
      - 'build.mcpp'
      - 'mcpp/**'
      # The library itself, its public headers and the resources hrc compiles.
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'platform/linux/**'
      - 'platform/windows/**'
      - 'platform/macos/**'
      - 'platform/android/**'
      - 'platform/ios/**'
      - 'platform/web/**'
      - 'resources/**'
      # Read by huxerui-build-check, which compares the two build systems.
      - 'cmake/platform/**'
      - 'cmake/HuxerUIBuild.cmake'
      - 'tools/codegen/**'
      - 'tools/resource_compiler/**'
      # Compiled by mcpp/huxerui-tests: the suite, what it links beside it, and
      # the vendored Catch2. Without these a change to a unit test would not run
      # the suite that compiles it.
      - 'tests/unit/**'
      - 'tests/support/**'
      - 'examples/buffer_reference/**'
      - '3dparty/catch2/**'
      # The generated-app job builds the CLI and instantiates every template,
      # so those trees are inputs to this workflow as much as the framework is.
      - 'templates/**'
      - 'tools/huxerui_cli/**'
      - 'tests/cli/**'
      - '.github/workflows/mcpp-build.yml'
      - '!**.[mM][dD]'
  workflow_dispatch:

concurrency:
  group: mcpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than latest: an mcpp release changes build behaviour, and a
  # green PR should stay green until someone chooses to move this line.
  MCPP_VERSION: '2026.9.15.2'
  # The Linux clang leg. Pinned for the same reason mcpp is: a toolchain
  # release changes what compiles, and a green PR should stay green until
  # someone moves this line. Windows and macOS already build with clang --
  # this axis is the one GCC otherwise hides.
  MCPP_LLVM: 'llvm@22.1.8'
  XLINGS_NON_INTERACTIVE: '1'

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: mcpp/CMake parity
    runs-on: ubuntu-24.04
    # The workspace build compiles the four test suites: 17 minutes measured
    # with a warm cache, past 20 with a cold one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          xlings install "mcpp@${MCPP_VERSION}" -y || true

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }

      # The tooling is built by mcpp rather than written in Python: a
      # repository that offers mcpp as a first-class build system should not
      # need a second language to check its own build. It builds only the two
      # small programs and their dependencies, not the framework.
      - name: Unit-test the scanning the tools and the rules share
        working-directory: mcpp/huxerui-source-select
        run: mcpp test

      - name: Check that both build systems describe the same project
        working-directory: mcpp/huxerui-tools
        run: mcpp run huxerui-build-check

      # The module shell and the scope prelude are generated from the public
      # headers; a public name added to a header and not to the shell is a name
      # `import huxerui;` cannot see.
      - name: Check that the module shell is up to date
        working-directory: mcpp/huxerui-tools
        run: mcpp run huxerui-module-gen -- --check

      # `[workspace] members` is otherwise a table nothing reads. It was wrong
      # when this ran for the first time: huxerui-build-rules was listed, and
      # that package imports mcpp, so it compiles only inside a build program's
      # compile and the fan-out died on the first member with `failed to read
      # compiled module`.
      - name: Build every workspace member
        run: mcpp build --workspace

  linux:
    name: mcpp build (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      # NOTE: no apt-get. The GTK stack comes from the xlings payloads declared
      # in [target.'cfg(linux)'.xlings.workspace], because mcpp compiles with
      # its own toolchain and its own glibc -- see the comment there for what
      # mixing the host's glibc in actually produces. CMake keeps using the
      # distribution's packages; the two build systems answer "where does GTK
      # come from" differently on purpose.
      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          # The payload store holds the whole GTK closure (36 packages), so
          # the key names the manifest that selects them.
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }

      # The framework: 67 core sources, platform/linux, the builtin resource
      # header (hrc) and the C++20 module shell. mcpp provisions the GTK
      # payloads itself; this step is separate only so a provisioning failure
      # is attributed to provisioning rather than to the compile.
      - name: Build the framework
        run: |
          mcpp build 2>&1 | tee build.log
          # Every dependency is written with the identity its manifest declares.
          ! grep -n "declares the dependency" build.log \
            || { echo "a dependency key names another identity than its manifest"; exit 1; }

      # Three applications on top of it. Each mcpp.toml names one dependency
      # and each build.mcpp is one call; everything else -- GTK on the link
      # line, the composable transform, the resource packages -- arrives
      # through the dependency edge.
      - name: Build the examples
        run: |
          for example in mcpp/examples/0*/; do
            echo "--- $example"
            ( cd "$example" && mcpp build )
          done
      # The package the runtime reads is deployed beside the executable by
      # huxerui.rules (one `mcpp::deploy` per payload); this is the assertion
      # that the desktop path has resources at run time at all.
      - name: Assert the resource package is beside the executable
        working-directory: mcpp/examples/01-import
        run: |
          exe=$(find target -type f -name huxerui_example_import -path '*/bin/*' | head -1)
          test -n "$exe" || { echo "01 produced no executable"; exit 1; }
          res="$(dirname "$exe")/huxerui_example_import.resources"
          test -f "$res/huxerui/resources.bin" || { echo "no resource index under $res"; exit 1; }
          test -f "$res/huxerui/huxerui/images/check.huxv" || { echo "a builtin payload is missing under $res"; exit 1; }
          echo "resources deployed: $(find "$res" -type f | wc -l) files"
          # The repository's examples ask for profiling, as CMake builds its tree.
          strings "$exe" | grep -q 'profiling mode must be' \
            || { echo "example 01 was built without the profiling feature it asks for"; exit 1; }

      # The AppImage is mcpp:plugins' dist-appimage, reached through
      # huxerui.rules; the payload it runs is declared by the member itself.
      - name: Pack the example as an AppImage
        working-directory: mcpp/examples/01-import
        run: |
          mcpp pack --format appimage
          image=$(find target -name '*.AppImage' | head -1)
          test -n "$image" || { echo "no AppImage was produced"; exit 1; }
          test "$(stat -c %s "$image")" -gt 1048576 || { echo "the AppImage is implausibly small"; exit 1; }
          echo "packed $image ($(stat -c %s "$image") bytes)"

      # The suite that says the LIBRARY works, not just that it links. Same
      # sources tests/unit/CMakeLists.txt compiles and the same vendored
      # Catch2, against the framework mcpp built.
      - name: Run the test suites
        # One package per suite under mcpp/huxerui-tests, one program each, as
        # CMake builds one executable per suite: unit, runtime, the UI testing
        # suite and the windowless smoke.
        run: |
          for suite in unit runtime ui smoke; do
            echo "--- $suite"
            ( cd "mcpp/huxerui-tests/$suite" && mcpp test )
          done

      - name: Pack the library and check its shape
        shell: bash
        run: |
          mcpp pack
          archive=$(find target/dist -name 'huxerui-*.tar.gz' -o -name 'huxerui-*.zip' | head -1)
          test -n "$archive" || { echo "mcpp pack produced no archive"; exit 1; }
          echo "packed $archive"
          list=$(tar tzf "$archive" 2>/dev/null || unzip -Z1 "$archive")
          for expected in 'include/huxerui/huxerui.h' 'interface/huxerui.cppm' 'mcpp.toml'; do
            echo "$list" | grep -q "$expected" \
              || { echo "the package omits $expected"; exit 1; }
          done
          # Both consumption paths belong in the package: a consumer writing
          # `#include <huxerui/huxerui.h>` and one writing `import huxerui;`
          # are looking at the same library.
          echo "$list" | grep -qE 'lib/.+/(libhuxerui\.a|huxerui\.lib)' \
            || { echo "the package carries no library"; exit 1; }
          echo "package carries headers, the module interface and a library"
      - name: Assert the composable transform ran and is macro-free
        working-directory: mcpp/examples/02-module-units
        run: |
          # Name the unit rather than taking the first match. hcg's output
          # directory ACCUMULATES -- renaming a source leaves its old
          # transformed copy behind -- so `find ... | head -1` asserts on
          # whichever file the directory happens to yield first. That is green
          # on a fresh runner and wrong in any tree that has been built before.
          generated=$(find target -path '*hcg*' -name '*counter.cppm' | head -1)
          test -n "$generated" || { echo "hcg did not transform src/counter.cppm"; exit 1; }
          grep -q 'return ::huxerui::Scope(' "$generated" \
            || { echo "transformed source lacks the composable scope"; exit 1; }
          # A generated module interface must still declare itself, or the
          # importer compiles first and dies on "failed to read compiled module".
          grep -q '^export module ' "$generated" \
            || { echo "the transform dropped the module declaration"; exit 1; }
          # Macros do not cross a module boundary, so generated code that named
          # HUXERUI_SCOPE_BEGIN would not compile under `import huxerui;`.
          ! grep -q 'HUXERUI_SCOPE_BEGIN' "$generated" \
            || { echo "transform still injects the macro name"; exit 1; }
          echo "composable transform verified in $generated"

      # A scope written by hand needs no macro and therefore no header.
      # HUXERUI_SCOPE expands to `return Scope([=]() -> View {...})`, and
      # `import huxerui;` carries Scope and View even though it cannot carry the
      # macro -- so the module-native spelling is the expansion, which is also
      # what hcg injects. The prelude header remains for a NON-module
      # translation unit in an mcpp project, which the rule force-includes; it
      # is asserted here because no example needs it any more.
      - name: Assert a hand-written scope needs no macro
        working-directory: mcpp/examples/02-module-units
        run: |
          grep -q 'return Scope(\[=\]() -> View' src/banner.cppm \
            || { echo "02 no longer spells a scope out by hand"; exit 1; }
          # Comment lines excluded: the file explains what the macro is, which
          # an unanchored pattern would read as using it.
          ! grep -vE '^[[:space:]]*//' src/banner.cppm | grep -q 'HUXERUI_SCOPE' \
            || { echo "02 went back to the macro; the module path does not need it"; exit 1; }
          grep -rq -- 'huxerui-build-rules[/\\]include' target/*/*/build.ninja \
            || { echo "the prelude directory never reached the include path"; exit 1; }
          echo "hand-written scope compiles with no macro and no header"

      - name: Assert the examples consume HuxerUI as a module
        working-directory: mcpp/examples/01-import
        run: |
          grep -q '^import huxerui;' src/main.cpp \
            || { echo "01 no longer imports the module"; exit 1; }
          # No headers in ANY example, in any unit: `import std;` covers
          # std::type_info and `import huxerui;` covers everything else.
          ! grep -rn '^[[:space:]]*#include' ../0*/src ../0*/widgets/src \
            || { echo "an example gained a header"; exit 1; }
          # Anchored: the file's own comment explains what `import` replaces,
          # and an unanchored pattern matches that sentence.
          echo "01 builds against import huxerui;, with no headers"

      # The umbrella header is the CMake build's contract, and this PR must not
      # touch it. Compile it standalone with the SYSTEM compiler -- the one
      # CMake uses -- rather than mcpp's payload g++, which needs the sysroot
      # flags mcpp passes and fails on `features.h` without them.
      - name: Assert the header path still compiles
        run: |
          printf '#include <huxerui/huxerui.h>\nint main() { return 0; }\n' \
            > /tmp/header_only.cpp
          g++ --version | head -1
          g++ -std=c++20 -fsyntax-only -Iinclude /tmp/header_only.cpp
          echo "#include <huxerui/huxerui.h> still compiles"

  linux-llvm:
    name: mcpp build (linux x86_64, clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-llvm-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-llvm-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-
            mcpp-llvm-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      # `mcpp toolchain default` once, rather than --toolchain on each command.
      # Only `mcpp build` takes that flag: `mcpp test` and `mcpp pack` reject it
      # with `unknown option: --toolchain`, so a per-command flag would have to
      # be a per-command environment variable for two of the three.
      - name: Select the pinned mcpp and make clang the default toolchain
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version
          # `default` selects; it does not install. On a cold cache the next
          # command is `error: llvm@22.1.8 is not installed`.
          mcpp toolchain install "${MCPP_LLVM}"
          mcpp toolchain default "${MCPP_LLVM}"
          mcpp toolchain list

      - name: Build the framework
        run: |
          mcpp build 2>&1 | tee build.log
          # Every dependency is written with the identity its manifest declares.
          ! grep -n "declares the dependency" build.log \
            || { echo "a dependency key names another identity than its manifest"; exit 1; }

      # THIS is the step the job exists for. A library builds under either
      # compiler; consuming it as a MODULE is where they diverge, because clang
      # records the thread model and target-feature set in the BMI and refuses
      # one that disagrees with the importing translation unit. When that
      # happens `import huxerui;` yields nothing and every name in the demo is
      # undefined -- 19 errors that name the demo and never mention the BMI.
      #
      # The grep runs over THIS build's output, not a second one: a repeat
      # `mcpp build` is fully cached, emits no compile lines, and would make
      # the assertion pass by having nothing to read.
      - name: Build the example application, and check the BMI was loaded
        working-directory: mcpp/examples/02-module-units
        run: |
          set -o pipefail
          mcpp build 2>&1 | tee build.log
          # A configuration mismatch is a warning before it is an error, so a
          # build can pass while the module was quietly not in effect.
          ! grep -q 'module-file-config-mismatch' build.log \
            || { echo "clang rejected the BMI; import huxerui; is not in effect"; exit 1; }
          ! grep -q 'was compiled with the target feature' build.log \
            || { echo "BMI and consumer disagree about target features"; exit 1; }
          echo "clang loaded huxerui.pcm"

      # The suite that says the LIBRARY works, not just that it links. Same
      # sources tests/unit/CMakeLists.txt compiles and the same vendored
      # Catch2, against the framework mcpp built.
      - name: Run the test suites
        # One package per suite under mcpp/huxerui-tests, one program each, as
        # CMake builds one executable per suite: unit, runtime, the UI testing
        # suite and the windowless smoke.
        run: |
          for suite in unit runtime ui smoke; do
            echo "--- $suite"
            ( cd "mcpp/huxerui-tests/$suite" && mcpp test )
          done

      - name: Pack the library and check its shape
        run: |
          mcpp pack
          archive=$(find target/dist -name 'huxerui-*.tar.gz' | head -1)
          test -n "$archive" || { echo "mcpp pack produced no archive"; exit 1; }
          echo "packed $archive"

  macos:
    name: mcpp build (macos arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # No payload closure here: AppKit and the twelve other frameworks come
      # from the machine's SDK, which is what `aarch64-macos` means in mcpp's
      # target table. Only Linux declares [xlings.workspace] entries.
      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }

      # 25 Objective-C++ sources compiled with -fobjc-arc, and the frameworks
      # from the top-level [runtime] table -- which the engine renders only for
      # Mach-O, so the manifest states them once and unconditionally.
      - name: Build the framework
        run: |
          mcpp build 2>&1 | tee build.log
          # Every dependency is written with the identity its manifest declares.
          ! grep -n "declares the dependency" build.log \
            || { echo "a dependency key names another identity than its manifest"; exit 1; }

      - name: Build the examples
        run: |
          for example in mcpp/examples/0*/; do
            echo "--- $example"
            ( cd "$example" && mcpp build )
          done
      # The suite that says the LIBRARY works, not just that it links. Same
      # sources tests/unit/CMakeLists.txt compiles and the same vendored
      # Catch2, against the framework mcpp built.
      - name: Run the test suites
        # One package per suite under mcpp/huxerui-tests, one program each, as
        # CMake builds one executable per suite: unit, runtime, the UI testing
        # suite and the windowless smoke.
        run: |
          for suite in unit runtime ui smoke; do
            echo "--- $suite"
            ( cd "mcpp/huxerui-tests/$suite" && mcpp test )
          done

      - name: Pack the library and check its shape
        shell: bash
        run: |
          mcpp pack
          archive=$(find target/dist -name 'huxerui-*.tar.gz' -o -name 'huxerui-*.zip' | head -1)
          test -n "$archive" || { echo "mcpp pack produced no archive"; exit 1; }
          echo "packed $archive"
          list=$(tar tzf "$archive" 2>/dev/null || unzip -Z1 "$archive")
          for expected in 'include/huxerui/huxerui.h' 'interface/huxerui.cppm' 'mcpp.toml'; do
            echo "$list" | grep -q "$expected" \
              || { echo "the package omits $expected"; exit 1; }
          done
          # Both consumption paths belong in the package: a consumer writing
          # `#include <huxerui/huxerui.h>` and one writing `import huxerui;`
          # are looking at the same library.
          echo "$list" | grep -qE 'lib/.+/(libhuxerui\.a|huxerui\.lib)' \
            || { echo "the package carries no library"; exit 1; }
          echo "package carries headers, the module interface and a library"
  # ---------------------------------------------------------------- Web ----
  # The Emscripten row. The framework is built as example 01's dependency
  # rather than at the root: the artifact's exception model is stated by the
  # root, and the application is the root that states it. emsdk is a payload
  # mcpp installs on first use.
      # The `.app` carries the executable under Contents/MacOS and the deployed
      # resource package under Contents/Resources/HuxerUI -- the layout
      # `huxerui_add_resources` stages for a CMake bundle, and where the AppKit
      # adapter reads without any fallback.
      - name: Pack the example as a bundle and check its layout
        working-directory: mcpp/examples/01-import
        run: |
          # An application's own Info.plist entries, where an Xcode project
          # keeps them: `macos/Info.plist`, merged over the entries CMake's
          # application template writes.
          mkdir -p macos
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' \
            '<key>NSCameraUsageDescription</key><string>Scans a code.</string></dict></plist>' > macos/Info.plist
          mcpp pack --format app 2>&1 | tee pack.log
          app=$(find target -type d -name '*.app' | head -1)
          test -n "$app" || { echo "dist-apple produced no bundle"; exit 1; }
          test -f "$app/Contents/MacOS/huxerui_example_import" || { echo "the bundle carries no executable under Contents/MacOS"; exit 1; }
          test -f "$app/Contents/Resources/HuxerUI/huxerui/resources.bin" || { echo "the resource package is not under Contents/Resources/HuxerUI"; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Info.plist" | tee plist.txt
          grep -q '"CFBundleIdentifier" => "org.huxerui.example01"' plist.txt || { echo "CFBundleIdentifier is not the build program's"; exit 1; }
          grep -q '"CFBundleDisplayName" => "huxerui_example_import"' plist.txt || { echo "the template's CFBundleDisplayName is missing"; exit 1; }
          grep -q '"NSCameraUsageDescription" => "Scans a code."' plist.txt || { echo "macos/Info.plist did not reach the bundle"; exit 1; }
          # CMake builds for macOS 12. libc++ comes from the graph on this row,
          # compiled for the application's floor, so nothing in the program
          # needs a newer system and it loads no system libc++.
          otool -l "$app/Contents/MacOS/huxerui_example_import" | tee load.txt | grep -A4 LC_BUILD_VERSION | grep -E 'minos'
          grep -A4 LC_BUILD_VERSION load.txt | grep -qE 'minos 12\.0$' || { echo "the program's minimum macOS is not 12.0"; exit 1; }
          ! otool -L "$app/Contents/MacOS/huxerui_example_import" | grep -n 'libc++' \
            || { echo "the program loads a system libc++"; exit 1; }
          ! grep -n 'was built for newer macOS version' pack.log \
            || { echo "an object in the link was built for a newer macOS than 12.0"; exit 1; }
          echo "bundle: $app"

      # `huxerui run macos` is `mcpp run --target aarch64-macos --format app`,
      # and the runner named `app` is dist-apple's `macapp-run`: the bundle's
      # program in the foreground, its output and its status. The manifest
      # names no runner, so a plain `mcpp run` executes the program itself.
      - name: Run the bundle through dist-apple's runner
        working-directory: mcpp/examples/01-import
        run: |
          mcpp run --target aarch64-macos --format app --list-runners 2>&1 | tee runners.txt
          grep -qE 'app[[:space:]]+macapp-run' runners.txt || { echo "the app runner is not macapp-run"; exit 1; }
          ! grep -n '"open"\|[[:space:]]open[[:space:]]' runners.txt || { echo "a runner still hands the bundle to open"; exit 1; }

      # `huxerui package macos` produces a DMG under CMake, and so does mcpp:
      # the bundle beside an Applications link, in a compressed image.
      - name: Pack the example as a DMG and check its layout
        working-directory: mcpp/examples/01-import
        run: |
          mcpp pack --format dmg 2>&1 | tee dmg.log
          dmg=$(find target -name '*.dmg' | head -1)
          test -n "$dmg" || { echo "dist-apple produced no DMG"; exit 1; }
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
          ok=1
          test -n "$app" || { echo "the DMG carries no bundle"; ok=0; }
          test -z "$app" || test -f "$app/Contents/Resources/HuxerUI/huxerui/resources.bin" || { echo "the DMG's bundle has no resources"; ok=0; }
          test "$(readlink "$mnt/Applications")" = "/Applications" || { echo "the DMG has no Applications link"; ok=0; }
          hdiutil detach "$mnt"
          test "$ok" = 1

      # The framework linked shared on macOS is an explicit choice of the
      # application's (`linkage = "shared"`), and the bundle then carries it in
      # Contents/Frameworks, signed, loaded through @rpath.
      - name: Pack a shared-framework bundle
        run: |
          cp -R mcpp/examples/01-import "$RUNNER_TEMP/01-import-shared"
          rm -rf "$RUNNER_TEMP/01-import-shared/target"
          mkdir -p mcpp/examples/99-shared
          cp -R "$RUNNER_TEMP/01-import-shared/." mcpp/examples/99-shared/
          cd mcpp/examples/99-shared
          sed -i '' 's|^huxerui.huxerui = { path = "../../..", features = \["profiling"\] }$|huxerui.huxerui = { path = "../../..", features = ["profiling"], linkage = "shared" }|' mcpp.toml
          grep -n 'linkage = "shared"' mcpp.toml
          # With the toolchain's libc++ and its 14.0 floor: a C++ shared library
          # in a graph whose C++ runtime is a package is refused
          # (`shared-library-cxx-runtime`, mcpp-community/mcpp#641 item 5), so
          # this option does not take the application's `llvm.libcxx`. Whether
          # a std exception thrown in the dylib is caught by type in the program
          # is mcpp-community/mcpp#646 F2, not measured here.
          sed -i '' -e "/^\[target.'cfg(any(os = \"macos\", os = \"ios\"))'.dependencies\]$/d" -e '/^llvm.libcxx = /d' \
            -e 's|^macos_deployment_target = "12.0"$|macos_deployment_target = "14.0"|' mcpp.toml
          ! grep -n '^llvm.libcxx' mcpp.toml
          mcpp pack --format app 2>&1 | tee pack.log
          app=$(find target -type d -name '*.app' | head -1)
          test -n "$app" || { echo "no bundle"; exit 1; }
          find "$app/Contents/Frameworks" -name 'libhuxerui*.dylib' | grep -q . || { echo "the bundle carries no framework dylib"; exit 1; }
          otool -L "$app/Contents/MacOS/huxerui_example_import" | grep -n '@rpath/libhuxerui'
          codesign --verify --deep --strict "$app"
          echo "shared bundle: $app"

  web:
    name: mcpp build (wasm32-emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-web-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-web-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-web-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }

      - name: Build the example for the Web
        working-directory: mcpp/examples/01-import
        run: mcpp build --target wasm32-emscripten

      # dist-web writes the launcher, the implicit .wasm, the preloaded
      # resources and the page huxerui.rules ships into one static directory.
      - name: Pack the static directory and check its shape
        working-directory: mcpp/examples/01-import
        run: |
          mcpp pack --target wasm32-emscripten --format web
          web=$(find target -type d -name web -path '*out/web' | head -1)
          test -n "$web" || { echo "dist-web produced no directory"; exit 1; }
          for f in index.html huxerui_example_import.js huxerui_example_import.wasm huxerui_example_import.data; do
            test -f "$web/$f" || { echo "the Web directory lacks $f"; exit 1; }
          done
          magic=$(head -c 4 "$web/huxerui_example_import.wasm" | od -An -tx1 | tr -d ' \n')
          test "$magic" = "0061736d" || { echo "the .wasm is not a WebAssembly module (magic $magic)"; exit 1; }
          grep -q 'createHuxerUIApp' "$web/index.html" || { echo "the page does not load the launcher"; exit 1; }
          echo "web directory: $(ls "$web" | tr '\n' ' ')"

  # ---------------------------------------------------------- iOS simulator ----
  # The simulator row: the compiler is the llvm payload, the SDK is Xcode's,
  # located rather than installed. dist-apple assembles the flat bundle and
  # simctl-run (xim:apple-simulator-tools) installs and launches it.
  ios-sim:
    name: mcpp build (aarch64-ios-sim)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-ios-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-ios-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-ios-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }

      - name: Build the example for the simulator
        working-directory: mcpp/examples/01-import
        run: mcpp build --target aarch64-ios-sim

      # The bundle is flat: the executable, Info.plist and the deployed
      # resource package at its root (`HuxerUI/`), the layout CMake's Xcode
      # shell stages -- mcpp 2026.9.13.2 stages the declared files before the
      # closure walk and dist-apple 0.9.2 places them at the resource root.
      - name: Pack the bundle and check its shape
        working-directory: mcpp/examples/01-import
        run: |
          # The application's own Info.plist entries, merged over the template's.
          mkdir -p ios
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' \
            '<key>NSCameraUsageDescription</key><string>Scans a code.</string></dict></plist>' > ios/Info.plist
          mcpp pack --target aarch64-ios-sim --format app 2>&1 | tee pack.log
          app=$(find target -type d -name '*.app' | head -1)
          test -n "$app" || { echo "dist-apple produced no bundle"; exit 1; }
          test -f "$app/huxerui_example_import" || { echo "the bundle carries no executable"; exit 1; }
          plutil -lint "$app/Info.plist"
          plutil -p "$app/Info.plist" | tee plist.txt
          grep -q '"MinimumOSVersion" => "15.0"' plist.txt || { echo "MinimumOSVersion is not the manifest's 15.0"; exit 1; }
          grep -q '"CFBundleIdentifier" => "org.huxerui.example01"' plist.txt || { echo "CFBundleIdentifier is not the build program's"; exit 1; }
          # The entries CMake's iOS template writes: without a launch screen iOS
          # runs the application in compatibility mode, not at the device's
          # resolution.
          plutil -extract UILaunchScreen raw -o - "$app/Info.plist" || { echo "the bundle declares no launch screen"; exit 1; }
          grep -q '"CFBundleDisplayName" => "huxerui_example_import"' plist.txt || { echo "the template's CFBundleDisplayName is missing"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:2' "$app/Info.plist")" = UIInterfaceOrientationLandscapeRight ] \
            || { echo "the iPhone orientations are not the template's"; exit 1; }
          grep -q '"NSCameraUsageDescription" => "Scans a code."' plist.txt || { echo "ios/Info.plist did not reach the bundle"; exit 1; }
          test -f "$app/HuxerUI/huxerui/resources.bin" || { echo "the resource package is not at the bundle root"; exit 1; }
          echo "bundle: $app"

      # The manifest names no runner: huxerui.rules supplies `simctl-run` on
      # the simulator row, which `huxerui run ios` reaches through mcpp.
      - name: Check the simulator runner
        working-directory: mcpp/examples/01-import
        run: |
          mcpp run --target aarch64-ios-sim --format app --list-runners 2>&1 | tee runners.txt
          grep -q 'simctl-run' runners.txt || { echo "the simulator runner is not simctl-run"; exit 1; }

  android:
    name: mcpp build (x86_64-linux-android)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-android-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-android-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-android-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }


      - name: Build the example for Android
        working-directory: mcpp/examples/01-import
        run: mcpp build --target x86_64-linux-android

      - name: Pack the APK and check its contents
        working-directory: mcpp/examples/01-import
        run: |
          # `huxerui package android` under CMake is the Gradle APK for the ABIs
          # gradle.properties lists, arm64-v8a and x86_64; one mcpp pack with
          # both targets produces the same.
          mcpp pack --target aarch64-linux-android --target x86_64-linux-android --format apk
          apk=$(find target -name '*.apk' | grep -v base.apk | head -1)
          test -n "$apk" || { echo "dist-apk produced no APK"; exit 1; }
          unzip -Z1 "$apk" | tee contents.txt
          # The framework is its own libhuxerui.so beside the application's in
          # each ABI, as under Gradle; the launcher icon is the SDK's unless the
          # application supplies android/res.
          for f in lib/x86_64/libhuxerui_example_import.so lib/x86_64/libhuxerui.so \
                   lib/arm64-v8a/libhuxerui_example_import.so lib/arm64-v8a/libhuxerui.so assets/huxerui/resources.bin \
                   classes.dex AndroidManifest.xml resources.arsc res/mipmap-anydpi-v26/ic_launcher.xml; do
            grep -qx "$f" contents.txt || { echo "the APK lacks $f"; exit 1; }
          done
          # A release package without a keystore is unsigned and aligned, as
          # Gradle's release variant without a signing configuration is.
          ! grep -qE '^META-INF/.*\.(RSA|EC)$' contents.txt || { echo "the release APK is signed without a keystore"; exit 1; }
          zipalign=$(find ~/.mcpp/registry/data/xpkgs -name zipalign -type f | head -1)
          "$zipalign" -c -p 4 "$apk" || { echo "the release APK is not aligned"; exit 1; }
          aapt2=$(find ~/.mcpp/registry/data/xpkgs -name aapt2 -type f | head -1)
          "$aapt2" dump badging "$apk" | tee badging.txt | grep -E "^(application:|targetSdkVersion)"
          grep -q "^application-icon" badging.txt || { echo "the manifest names no launcher icon"; exit 1; }
          grep -q "targetSdkVersion:'36'" badging.txt || { echo "targetSdkVersion is not 36"; exit 1; }
          grep -q "package: name='org.huxerui.example01'" badging.txt || { echo "the application id is not the build program's"; exit 1; }
          grep -q "versionName='0.1.0'" badging.txt || { echo "versionName is not the package version"; exit 1; }
          grep -q "launchable-activity: name='org.huxerui.example01.MainActivity'" badging.txt || { echo "the launcher is not the generated MainActivity"; exit 1; }
          grep -q "native-code: 'arm64-v8a' 'x86_64'" badging.txt || { echo "the APK does not carry both ABIs"; exit 1; }
          echo "apk: $apk"
          # A debug package is signed with the Android debug key, as Gradle's
          # debug variant is, so `huxerui run android` installs it.
          mcpp pack --profile dev --target x86_64-linux-android --format apk 2>&1 | tee pack-dev.log
          dev=$(sed -n 's/^ *Packed //p' pack-dev.log | tail -1)
          apksigner=$(find ~/.mcpp/registry/data/xpkgs -name apksigner -type f | head -1)
          "$apksigner" verify --print-certs "$dev" | tee certs.txt | head -3
          grep -q 'CN=Android Debug' certs.txt || { echo "the debug APK is not signed with the debug key"; exit 1; }
          # The manifest names no runner: huxerui.rules supplies `adb-run`.
          mcpp run --target x86_64-linux-android --format apk --list-runners 2>&1 | tee runners.txt
          grep -q 'adb-run' runners.txt || { echo "the Android runner is not adb-run"; exit 1; }

      # THE ANDROID EXTENSION POINTS a Gradle project has, on the example that
      # depends on a library: the application's Kotlin (the framework's
      # `android-kotlin` feature), its `android/libs` archives, a Maven
      # dependency through the lock (`android-maven`), and the library's own
      # Java, res/ and manifest. Written into the checkout for this job only.
      - name: Kotlin, a library's Android sources, local archives and a Maven dependency reach the APK
        working-directory: mcpp/examples/03-library
        run: |
          set -euo pipefail
          sed -i 's|^huxerui.huxerui = { path = "../../..", features = \["profiling"\] }$|huxerui.huxerui = { path = "../../..", features = ["profiling", "android-kotlin", "android-maven"] }|' mcpp.toml
          grep -q 'android-kotlin' mcpp.toml
          sed -i 's|^        .bundle_identifier = "org.huxerui.example03",$|        .bundle_identifier = "org.huxerui.example03",\n        .android           = { .maven = { "androidx.startup:startup-runtime:1.1.1" } },|' build.mcpp
          grep -q 'androidx.startup' build.mcpp
          mkdir -p android/kotlin/org/huxerui/example03 android/libs \
                   widgets/android/java/org/huxerui/widgets widgets/android/res/values
          printf 'package org.huxerui.example03\n\nobject KotlinProbe {\n    fun greeting(name: String) = "hello, $name"\n}\n' \
            > android/kotlin/org/huxerui/example03/KotlinProbe.kt
          printf 'package org.huxerui.widgets;\n\npublic final class WidgetsProbe {\n    public static int label() { return R.string.widgets_label; }\n}\n' \
            > widgets/android/java/org/huxerui/widgets/WidgetsProbe.java
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><string name="widgets_label">widgets</string></resources>' \
            > widgets/android/res/values/strings.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.huxerui.widgets">' \
            '<uses-permission android:name="android.permission.VIBRATE"/></manifest>' > widgets/android/AndroidManifest.xml
          jdk=$(find ~/.mcpp/registry/data/xpkgs/xim-x-jdk-temurin -mindepth 1 -maxdepth 1 -type d | head -1)
          probe=$(mktemp -d)
          mkdir -p "$probe/org/huxerui/archive"
          printf 'package org.huxerui.archive;\npublic final class ArchiveProbe {}\n' > "$probe/org/huxerui/archive/ArchiveProbe.java"
          "$jdk/bin/javac" -d "$probe/classes" "$probe/org/huxerui/archive/ArchiveProbe.java"
          "$jdk/bin/jar" cf android/libs/archive-probe.jar -C "$probe/classes" .

          MCPP_DIST_APK_MAVEN=update mcpp pack --profile dev --target x86_64-linux-android --format apk 2>&1 | tee pack.log
          apk=$(sed -n 's/^ *Packed //p' pack.log | tail -1)
          test -f "$apk" || { echo "the pack reported no APK"; exit 1; }
          test -f android/maven.lock || { echo "no Maven lock was written beside the manifest"; exit 1; }
          grep -q '^artifact androidx.startup:startup-runtime:1.1.1 ' android/maven.lock
          bt=$(find ~/.mcpp/registry/data/xpkgs/xim-x-android-build-tools -mindepth 1 -maxdepth 1 -type d | head -1)
          out=$(mktemp -d)
          unzip -q "$apk" -d "$out"
          for dex in "$out"/classes*.dex; do "$bt/dexdump" "$dex" 2>/dev/null; done \
            | sed -n "s/^ *Class descriptor *: '\(.*\)'$/\1/p" | sort -u > classes.txt
          for c in 'Lorg/huxerui/example03/KotlinProbe;' 'Lkotlin/jvm/internal/Intrinsics;' \
                   'Lorg/huxerui/widgets/WidgetsProbe;' 'Lorg/huxerui/widgets/R$string;' \
                   'Lorg/huxerui/archive/ArchiveProbe;' 'Landroidx/startup/InitializationProvider;'; do
            grep -qxF "$c" classes.txt || { echo "the dex does not carry $c"; exit 1; }
          done
          "$bt/aapt2" dump permissions "$apk" | tee permissions.txt
          grep -q 'android.permission.VIBRATE' permissions.txt || { echo "the library's manifest was not merged"; exit 1; }
          "$bt/aapt2" dump xmltree "$apk" --file AndroidManifest.xml | grep -q 'org.huxerui.example03.androidx-startup' \
            || { echo "the Maven library's provider did not reach the manifest"; exit 1; }
          # An ordinary pack reads the lock and the cache and reaches no network.
          mcpp pack --profile dev --target x86_64-linux-android --format apk > pack-offline.log 2>&1 \
            || { cat pack-offline.log; echo "a pack with the lock and a warm cache failed"; exit 1; }
          echo "Kotlin, the library's Java, res/ and manifest, a local JAR and a Maven AAR are in $apk"

  windows:
    name: mcpp build (windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # mcpp locates MSVC on the machine for x86_64-windows-msvc; the
      # developer environment is what makes the Windows SDK headers and the
      # eighteen system import libraries reachable.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        shell: pwsh
        run: |
          if (-not (Test-Path "$HOME\.xlings")) {
            irm https://d2learn.org/xlings-install.ps1.txt | iex
          }
          "$HOME\.xlings\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$HOME\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Select the pinned mcpp
        shell: pwsh
        run: |
          xlings install "mcpp@$env:MCPP_VERSION" -y --use
          mcpp --version

      - name: Build the framework
        shell: pwsh
        run: mcpp build

      # All three, as the other jobs do. This job had built only 02 because its
      # step is written in pwsh and the loop that replaced the others did not
      # match it.
      - name: Build the examples
        shell: pwsh
        run: |
          Get-ChildItem -Directory mcpp/examples -Filter '0*' | ForEach-Object {
            Write-Host "--- $($_.Name)"
            Push-Location $_.FullName
            mcpp build
            if ($LASTEXITCODE -ne 0) { Pop-Location; throw "$($_.Name) failed" }
            Pop-Location
          }

      - name: Assert the Windows executable carries its version resource
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: mcpp/examples/02-module-units
        run: |
          $exe = Get-ChildItem -Recurse -Filter 'huxerui_example_module_units.exe' target | Select-Object -First 1
          if (-not $exe) { throw 'the demo produced no executable' }
          $info = $exe.VersionInfo
          Write-Host "FileVersion=$($info.FileVersion) ProductName=$($info.ProductName)"
          if (-not $info.FileVersion) { throw 'the executable carries no version resource' }

      # The MSI CMake's Windows package builds, from the same Package.wxs
      # template (huxerui.rules renders it), through mcpp:plugins' dist-wix. A
      # plain `mcpp build` above produces none; this step asks for one.
      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: mcpp/examples/02-module-units
        run: mcpp pack --format msi

      - name: Assert the MSI was produced
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: mcpp/examples/02-module-units
        run: |
          $msi = Get-ChildItem -Recurse -Filter '*.msi' target | Select-Object -First 1
          if (-not $msi) { throw 'huxerui.rules produced no installer' }
          Write-Host "built $($msi.FullName) ($([math]::Round($msi.Length/1KB)) KB)"

          # Read the File table rather than judging by size. A size threshold is
          # a proxy for "carries the application", and a poor one: an installer
          # whose source path resolved to nothing is a valid 52 KB MSI, and one
          # that carries the wrong file is any size at all.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
              'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember(
              'OpenView', 'InvokeMethod', $null, $db, @('SELECT FileName, FileSize FROM File'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $files = @()
          while ($true) {
            $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if (-not $row) { break }
            $name = $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(1))
            $size = $row.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $row, @(2))
            $files += [pscustomobject]@{ Name = $name; Size = $size }
          }
          $files | ForEach-Object { Write-Host "  $($_.Name)  $($_.Size) bytes" }
          if ($files.Count -eq 0) { throw 'the MSI carries no files' }
          $exe = $files | Where-Object { $_.Name -like '*huxerui_example_module_units.exe*' }
          if (-not $exe) { throw 'the MSI does not carry the application executable' }
          if ($exe.Size -lt 1MB) { throw "the installed executable is $($exe.Size) bytes, which is not the application" }
          # The resource package the runtime reads beside the executable, which
          # the program-only MSI of mcpp:plugins 0.10.0 left out.
          if (-not ($files | Where-Object { $_.Name -like '*resources.bin*' })) {
            throw 'the MSI does not carry the resource package'
          }
          # Not the installer interface: that is the Setup.exe's, not the application's.
          if ($files | Where-Object { $_.Name -like '*Installer*' }) { throw 'the MSI carries the installer interface' }

          # The Start menu shortcut CMake's Package.wxs declares.
          $view = $db.GetType().InvokeMember(
              'OpenView', 'InvokeMethod', $null, $db, @('SELECT Shortcut FROM Shortcut'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $shortcuts = 0
          while ($view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) { $shortcuts++ }
          if ($shortcuts -lt 1) { throw 'the MSI declares no shortcut' }
          Write-Host "$($files.Count) files, $shortcuts shortcuts"

      # Installed and removed the way the Setup.exe's chain does it, without the
      # interface (which has no silent mode, under CMake either): the program
      # and its resource package in Program Files, the Start menu shortcut, and
      # nothing left behind.
      - name: Install and remove the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: mcpp/examples/02-module-units
        run: |
          $msi = Get-ChildItem -Recurse -Filter 'huxerui_example_module_units.msi' target | Select-Object -First 1
          $folder = Join-Path $env:ProgramFiles 'huxerui-example-module-units'
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\huxerui-example-module-units\huxerui-example-module-units.lnk'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/l*v', 'install.log')
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "msiexec /i exited $($p.ExitCode)" }
          foreach ($f in @('huxerui_example_module_units.exe', 'huxerui_example_module_units.resources\huxerui\resources.bin')) {
            if (-not (Test-Path (Join-Path $folder $f))) { throw "the installation has no $f" }
          }
          if (-not (Test-Path $shortcut)) { throw 'the installation has no Start menu shortcut' }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "`"$($msi.FullName)`"", '/qn', '/l*v', 'uninstall.log')
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path (Join-Path $folder 'huxerui_example_module_units.exe')) { throw 'the program survived the removal' }
          if (Test-Path $shortcut) { throw 'the shortcut survived the removal' }
          Write-Host "installed into $folder and removed"

      # The Setup.exe CMake's `huxerui package` produces: a Burn bundle whose
      # interface is the application's own installer program, a host tool of
      # the example's Windows row built only under the `windows-installer`
      # feature (as CMake builds it for a package build only), with WiX's
      # mbanative.dll and the interface's resource package beside it.
      - name: Build the Setup.exe and check what it carries
        if: runner.os == 'Windows'
        working-directory: mcpp/examples/02-module-units
        run: |
          set -euo pipefail
          mcpp pack --format setup --features windows-installer 2>&1 | tee setup.log
          bundle=$(sed -n 's/^ *Packed //p' setup.log | tail -1 | tr -d '\r' | tr '\\' '/')
          case "$bundle" in
            */huxerui_example_module_units-Setup-0.1.0.exe) ;;
            *) echo "the pack reported '$bundle', not huxerui_example_module_units-Setup-0.1.0.exe"; exit 1 ;;
          esac
          test -f "$bundle"

          home=$(mcpp self env | awk -F'= *' '/^MCPP_HOME/{print $2; exit}' | tr -d '\r')
          home=$(cygpath -u "$home")
          wix="$home/registry/data/xpkgs/xim-x-wix/5.0.2-1/tool/tools/net6.0/any/wix.exe"
          native="$home/registry/data/xpkgs/xim-x-wix/5.0.2-1/bootstrapper/runtimes/win-x64/native/mbanative.dll"
          # The interface the bundle definition names: the tool mcpp built for
          # this build (the store may hold one per consumer configuration).
          interface=$(sed -n 's/.*<BootstrapperApplication SourceFile="\([^"]*\)".*/\1/p' \
            target/.build-mcpp/out/huxerui-windows/Bundle.wxs | head -1 | tr -d '\r')
          test -n "$interface" || { echo "the bundle definition names no interface"; exit 1; }
          interface=$(cygpath -u "$interface")
          case "$interface" in */huxerui_example_module_units-Installer.exe) ;; *) echo "the interface is $interface"; exit 1 ;; esac
          index=target/.build-mcpp/out/hrc/installer-final/package/huxerui/resources.bin
          msi=$(dirname "$bundle")/huxerui_example_module_units.msi
          for f in "$wix" "$native" "$index" "$msi"; do test -f "$f" || { echo "missing $f"; exit 1; }; done

          # Taken apart by WiX, the bundle's interface container carries the
          # interface, mbanative.dll and the resource package, and its attached
          # container the MSI. Compared by content: which names an extraction
          # without the bootstrapper application keeps is WiX's business.
          out="$PWD/target/setup-extract"
          rm -rf "$out"
          "$wix" burn extract "$(cygpath -w "$bundle")" -oba "$(cygpath -w "$out/ba")" -o "$(cygpath -w "$out/payloads")"
          find "$out" -type f | sed "s|^$out/||" | sort
          carries() {
            while IFS= read -r f; do cmp -s "$f" "$2" && return 0; done < <(find "$out/$1" -type f)
            echo "the bundle's $1 container does not carry $2"; exit 1
          }
          carries ba "$interface"
          carries ba "$native"
          carries ba "$index"
          carries payloads "$msi"
          echo "the Setup.exe carries the interface, mbanative.dll, its resource package and the MSI"

          # The interface's resources sit where its runtime reads them.
          grep -q 'Name="huxerui_example_module_units-Installer.resources\\huxerui\\resources.bin"' \
            target/.build-mcpp/out/huxerui-windows/Bundle.wxs

      # The suite that says the LIBRARY works, not just that it links. Same
      # sources tests/unit/CMakeLists.txt compiles and the same vendored
      # Catch2, against the framework mcpp built.
      - name: Run the test suites
        # One package per suite under mcpp/huxerui-tests, one program each, as
        # CMake builds one executable per suite: unit, runtime, the UI testing
        # suite and the windowless smoke.
        run: |
          for suite in unit runtime ui smoke; do
            echo "--- $suite"
            ( cd "mcpp/huxerui-tests/$suite" && mcpp test )
          done

      - name: Pack the library and check its shape
        shell: bash
        run: |
          mcpp pack
          archive=$(find target/dist -name 'huxerui-*.tar.gz' -o -name 'huxerui-*.zip' | head -1)
          test -n "$archive" || { echo "mcpp pack produced no archive"; exit 1; }
          echo "packed $archive"
          list=$(tar tzf "$archive" 2>/dev/null || unzip -Z1 "$archive")
          for expected in 'include/huxerui/huxerui.h' 'interface/huxerui.cppm' 'mcpp.toml'; do
            echo "$list" | grep -q "$expected" \
              || { echo "the package omits $expected"; exit 1; }
          done
          # Both consumption paths belong in the package: a consumer writing
          # `#include <huxerui/huxerui.h>` and one writing `import huxerui;`
          # are looking at the same library.
          echo "$list" | grep -qE 'lib/.+/(libhuxerui\.a|huxerui\.lib)' \
            || { echo "the package carries no library"; exit 1; }
          echo "package carries headers, the module interface and a library"

  generated-app:
    name: every template, created then built
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          xlings install "mcpp@${MCPP_VERSION}" -y || true

      - name: Select the pinned mcpp
        # A restored cache keeps whichever mcpp was active when it was saved;
        # `--use` activates the pinned one.
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y --use
          mcpp --version | tee version.txt
          grep -q "${MCPP_VERSION}" version.txt || { echo "mcpp ${MCPP_VERSION} is not the active mcpp"; exit 1; }


      # The CLI is a CMake artifact; only its dependencies are needed here, not
      # the framework's.
      - name: Build the huxerui CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libepoxy-dev libsoup-3.0-dev pkg-config ninja-build
          cmake -S . -B build-cli -G Ninja \
            -DHUXERUI_BUILD_EXAMPLES=OFF \
            -DHUXERUI_BUILD_SHARED=OFF \
            -DHUXERUI_BUILD_CLI=ON \
            -DHUXERUI_BUILD_TESTS=OFF
          cmake --build build-cli --target huxerui_cli --parallel

      # HUXERUI_HOME selects the SDK, and a source checkout is a valid one --
      # the CLI already resolves the app-development Skill from either layout.
      # Naming it here is what tells `create` that HuxerUI is this tree rather
      # than a release, so it writes a path dependency instead of the published
      # version, which is the only reason these projects can build before
      # HuxerUI is in an mcpp index.
      #
      # EVERY TEMPLATE, not just the default one. `templates/` is what
      # `mcpp new --template huxerui.huxerui:<name>` instantiates, and a
      # template that renders but does not compile is a broken project handed
      # to whoever runs that command.
      - name: Create and build a project from every template
        env:
          HUXERUI_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/build-cli/bin/huxerui"
          work="$RUNNER_TEMP/generated"
          mkdir -p "$work"

          run_one() {
            local dir="$1"; shift
            ( cd "$work" && "$cli" "$@" )
            local project="$work/$dir"

            grep -q '^huxerui.huxerui = { path = ' "$project/mcpp.toml" \
              || { echo "$dir: the CLI did not resolve a path dependency"; exit 1; }
            grep -q '^#   huxerui\.huxerui = ' "$project/mcpp.toml" \
              || { echo "$dir: the published identity is not recorded"; exit 1; }
            # One dependency line, as under CMake: the framework states its own
            # linkage and the rules supply the runners.
            ! grep -nE '(linkage|runner)[[:space:]]*=' "$project/mcpp.toml" \
              || { echo "$dir: the manifest names a linkage or a runner"; exit 1; }
            # No headers anywhere: the entry instantiates nothing and the module
            # unit reaches std::type_info through `import std;`.
            ! grep -rn '^[[:space:]]*#include' "$project/src" \
              || { echo "$dir: an mcpp project should carry no headers"; exit 1; }
            test ! -e "$project/CMakeLists.txt" \
              || { echo "$dir: an mcpp project should carry no CMakeLists.txt"; exit 1; }
            echo "--- $dir"
          }

          run_one AppDemo create app AppDemo --build mcpp --agent none
          run_one NavDemo create app NavDemo --build mcpp --template navigation --agent none
          run_one my-widgets create library my-widgets --build mcpp --agent none

          # The two applications build; the library is a lib, so its own test is
          # what says it works -- and `mcpp test` proves the module it exports
          # can actually be imported.
          ( cd "$work/AppDemo" && mcpp build )
          ( cd "$work/NavDemo" && mcpp build )
          ( cd "$work/my-widgets" && mcpp test )

      - name: Assert the transform ran on a generated project
        run: |
          cd "$RUNNER_TEMP/generated/AppDemo"
          generated=$(find target -path '*hcg*' -name '*app.cppm' | head -1)
          test -n "$generated" || { echo "hcg did not transform src/app.cppm"; exit 1; }
          grep -q 'return ::huxerui::Scope(' "$generated" \
            || { echo "the composable was not wrapped"; exit 1; }
          exe=$(find target -type f -name AppDemo | head -1)
          test -n "$exe" || { echo "no executable was produced"; exit 1; }
          # Built as an application of the SDK is: without compile-time
          # profiling, which CMake's distributed SDK refuses to carry.
          ! strings "$exe" | grep -n 'profiling mode must be' \
            || { echo "the generated application was built with profiling"; exit 1; }
          echo "generated project builds and runs the transform"
