name: mcpp Build

# The mcpp leg of the dual build system. CMake remains the full-platform path
# and the only path for Android, iOS and Web; this workflow covers what mcpp
# can build today (see .agents/docs/2026-09-09-mcpp-native-build-and-modules-plan.md).
#
# Two jobs on purpose. `parity` needs no toolchain and finishes in seconds, so
# the failure it catches -- a source added to one build system and not the
# other -- is reported before anyone waits on a compile.

on:
  push:
    branches: [main]
    paths:
      - 'mcpp.toml'
      - 'build.mcpp'
      - 'mcpp/**'
      - 'src/**'
      - 'include/**'
      - 'platform/linux/**'
      - 'resources/**'
      - 'cmake/platform/**'
      - 'cmake/HuxerUIBuild.cmake'
      - 'examples/mcpp_demo/**'
      - '.github/workflows/mcpp-build.yml'
  pull_request:
    paths:
      - 'mcpp.toml'
      - 'build.mcpp'
      - 'mcpp/**'
      - 'src/**'
      - 'include/**'
      - 'platform/linux/**'
      - 'resources/**'
      - 'cmake/platform/**'
      - 'cmake/HuxerUIBuild.cmake'
      - 'examples/mcpp_demo/**'
      - '.github/workflows/mcpp-build.yml'
  workflow_dispatch:

concurrency:
  group: mcpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than latest: an mcpp release changes build behaviour, and a
  # green PR should stay green until someone chooses to move this line.
  MCPP_VERSION: '2026.9.8.1'
  XLINGS_NON_INTERACTIVE: '1'

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: mcpp/CMake parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check that both build systems describe the same project
        run: python3 mcpp/parity/check_parity.py

  linux:
    name: mcpp build (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # NOTE: no apt-get. The GTK stack comes from the xlings payloads declared
      # in [target.'cfg(linux)'.xlings.workspace], because mcpp compiles with
      # its own toolchain and its own glibc -- see the comment there for what
      # mixing the host's glibc in actually produces. CMake keeps using the
      # distribution's packages; the two build systems answer "where does GTK
      # come from" differently on purpose.
      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          # The payload store holds the whole GTK closure (36 packages), so
          # the key names the manifest that selects them.
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.MCPP_VERSION }}-
            mcpp-${{ runner.os }}-${{ runner.arch }}-v2-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y
          mcpp --version

      # The framework: 67 core sources, platform/linux, the builtin resource
      # header (hrc) and the C++20 module shell. mcpp provisions the GTK
      # payloads itself; this step is separate only so a provisioning failure
      # is attributed to provisioning rather than to the compile.
      - name: Build the framework
        run: mcpp build

      # An application on top of it. Its mcpp.toml names one dependency and its
      # build.mcpp is one call; everything else -- GTK on the link line, the
      # composable transform, the resource packages -- arrives through the
      # dependency edge.
      - name: Build the example application
        working-directory: examples/mcpp_demo
        run: mcpp build

      # Three claims this PR makes, asserted rather than inferred.
      - name: Assert the composable transform ran and is macro-free
        working-directory: examples/mcpp_demo
        run: |
          generated=$(find target -path '*hcg*' -name '*.cpp' | head -1)
          test -n "$generated" || { echo "hcg produced no transformed source"; exit 1; }
          grep -q 'return ::huxerui::Scope(' "$generated" \
            || { echo "transformed source lacks the composable scope"; exit 1; }
          # Macros do not cross a module boundary, so generated code that named
          # HUXERUI_SCOPE_BEGIN would not compile under `import huxerui;`.
          ! grep -q 'HUXERUI_SCOPE_BEGIN' "$generated" \
            || { echo "transform still injects the macro name"; exit 1; }
          echo "composable transform verified in $generated"

      - name: Assert the demo consumes HuxerUI as a module
        working-directory: examples/mcpp_demo
        run: |
          grep -q '^import huxerui;' src/main.cpp \
            || { echo "the demo no longer imports the module"; exit 1; }
          # Anchored: the file's own comment explains what `import` replaces,
          # and an unanchored pattern matches that sentence.
          ! grep -qE '^[[:space:]]*#include <huxerui/' src/main.cpp \
            || { echo "the demo still includes the umbrella header"; exit 1; }
          echo "demo builds against import huxerui;"

      # The framework is the CMake build's contract too: `#include` must keep
      # working exactly as before. Compile the umbrella header on its own.
      - name: Assert the header path still compiles
        run: |
          echo '#include <huxerui/huxerui.h>' > /tmp/header_only.cpp
          echo 'int main() { return 0; }' >> /tmp/header_only.cpp
          # Pick a g++ that actually runs: the payload store also holds
          # symlinks and wrappers, and taking the first `find` hit produced
          # exit 127 rather than a diagnosis.
          gxx=""
          for candidate in $(find "$HOME/.mcpp" "$HOME/.xlings" \
                                  -type f -name 'g++' -perm -u+x 2>/dev/null); do
            if "$candidate" --version >/dev/null 2>&1; then gxx="$candidate"; break; fi
          done
          test -n "$gxx" || { echo "no runnable payload g++ found"; exit 1; }
          echo "using $gxx"
          "$gxx" -std=c++20 -fsyntax-only -Iinclude /tmp/header_only.cpp
          echo "#include <huxerui/huxerui.h> still compiles"
