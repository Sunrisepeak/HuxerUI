name: Build System Conformance

# Builds the conformance projects in buildtools/cts with every build-system
# integration and checks the facts the build-system contract defines
# (buildtools/specs/build-system-integration.md). The expected facts belong to
# each project, so no integration is the reference; `compare` then checks that
# the integrations agree on what has no fixed value, such as the content of the
# final resource package.

on:
  pull_request:
    paths:
      - 'buildtools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'mcpp.toml'
      - 'build.mcpp'
      - 'modules/**'
      - 'include/**'
      - 'src/**'
      - 'platform/linux/**'
      - 'resources/**'
      - 'tools/codegen/**'
      - 'tools/resource_compiler/**'
      - 'tools/prebuilt/**'
      - '.github/workflows/build-system-conformance.yml'
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MCPP_VERSION: '2026.11.17.1'
  MCPP_LLVM: 'llvm@22.1.8'
  XLINGS_NON_INTERACTIVE: '1'

defaults:
  run:
    shell: bash

jobs:
  cmake-linux:
    name: CMake (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install the CMake build's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libepoxy-dev libsoup-3.0-dev pkg-config ninja-build \
            gcc-14 g++-14 ccache xvfb xauth fonts-dejavu-core

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: conformance-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            conformance-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the conformance projects
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          xvfb-run -a python3 buildtools/cts/cts.py run \
            --integration cmake --platform linux --launch \
            --cmake-compiler-launcher ccache --out "$RUNNER_TEMP/cts"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-cmake-linux
          path: ${{ runner.temp }}/cts/results
          if-no-files-found: error

  mcpp-linux:
    name: mcpp (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The GTK stack comes from the xlings payloads the manifest declares; only
      # the virtual display the launch check needs is taken from the machine.
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-dejavu-core

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: conformance-mcpp-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-${{ hashFiles('mcpp.toml') }}
          restore-keys: |
            conformance-mcpp-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-

      - name: Install xlings and mcpp
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Select the pinned mcpp and toolchain
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y
          xlings use mcpp "${MCPP_VERSION}"
          mcpp --version
          mcpp toolchain install "${MCPP_LLVM}"

      - name: Run the conformance projects
        run: |
          xvfb-run -a python3 buildtools/cts/cts.py run \
            --integration mcpp --platform linux --launch \
            --mcpp-toolchain "${MCPP_LLVM}" --out "$RUNNER_TEMP/cts"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-mcpp-linux
          path: ${{ runner.temp }}/cts/results
          if-no-files-found: error

  compare:
    name: Integrations agree
    runs-on: ubuntu-24.04
    needs: [cmake-linux, mcpp-linux]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: results

      - name: Compare the integrations
        run: python3 buildtools/cts/cts.py compare results
