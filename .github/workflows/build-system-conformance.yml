      - name: "Check: startup and resource resolution"
        if: ${{ !cancelled() }}
        run: |
          ${{ matrix.target == 'linux' && 'xvfb-run -a ' || '' }}${{ matrix.python }} buildtools/cts/cts.py check --integration ${{ matrix.integration }} \
            --target ${{ matrix.target }} --check launch --out "$RUNNER_TEMP/cts"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.integration }}-${{ matrix.target }}
          path: ${{ runner.temp }}/cts/results
          if-no-files-found: error

  compare:
    name: Integrations agree
    runs-on: ubuntu-24.04
    needs: [conformance]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: results

      - name: Build matrix
        run: python3 buildtools/cts/cts.py matrix results

      - name: "Compare: final resource package"
        if: ${{ !cancelled() }}
        run: python3 buildtools/cts/cts.py compare --check resources results

      - name: "Compare: library-graph record"
        if: ${{ !cancelled() }}
        run: python3 buildtools/cts/cts.py compare --check libraries results

  compare-macos:
    name: Integrations agree (macOS hosts)
    runs-on: ubuntu-24.04
    needs: [conformance-macos]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*-macos
          path: results

      - name: Build matrix
        run: python3 buildtools/cts/cts.py matrix results

      - name: "Compare: final resource package"
        if: ${{ !cancelled() }}
        run: python3 buildtools/cts/cts.py compare --check resources results

      - name: "Compare: library-graph record"
        if: ${{ !cancelled() }}
        run: python3 buildtools/cts/cts.py compare --check libraries results
