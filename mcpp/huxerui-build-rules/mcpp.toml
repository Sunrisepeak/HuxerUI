# The rule package HuxerUI consumers import from their build.mcpp.
#
# It is a `host-module` dependency: mcpp compiles its lib-root module for the
# host in the same command as build.mcpp, which is what makes the BMI usable.
# The framework re-exports it, so an application declares `huxerui` and gets
# `import huxerui.rules;` without naming this package.

[package]
name        = "huxerui-build-rules"
namespace   = "huxerui"
version     = "0.3.0"
description = "mcpp build rules for HuxerUI: composable codegen and resource compilation"
license     = "MIT"

# The pure half, split out so `mcpp test` can cover it: this package imports
# mcpp and therefore cannot be built outside a build program's compile.
# A rule declares an inner rule in its OWN build-dependencies; the consumer may
# not import it, which is why nothing needs `reexport` here.
[build-dependencies]
huxerui-source-select = { path = "../huxerui-source-select", host-module = true }

# The distribution formats -- msi, appimage, app, apk, web -- are members of
# `mcpp:plugins`, imported by rules.cppm and reached through this edge. The
# members declare the payloads they run on their own feature axes, and a host
# module's declaration reaches every build program it is compiled into, so
# neither this package nor an application names xim:wix or xim:appimagetool.
#
# 0.9.0 is the floor: it carries dist-apk's manifest template and Java roots,
# which the Android rule needs, and dist-web's portable copy.
[build-dependencies.mcpp]
plugins = { version = "0.9.0", features = ["dist-wix", "dist-appimage", "dist-apple", "dist-apk", "dist-web"], host-module = true }

[lib]
# The module this package publishes is `huxerui.rules`; the package name is
# `huxerui-build-rules`, which is not a legal C++ module name and does not have to be.
path = "src/rules.cppm"

# THE API LEVEL THE JAVA HOST COMPILES AGAINST. dist-apk pins `android.jar`
# at 35-r2 on its own feature axis; platform/android's Java uses API 36
# (`Build.VERSION_CODES.BAKLAVA`, the accessibility CHECKED_STATE_* set),
# which is the compileSdk platform/android/gradle.properties states for the
# Gradle build. This pin overrides the member's for every build program the
# rule module is compiled into, so `javac -cp android.jar` sees the same API
# surface both build systems compile against.
[target.'cfg(env = "android")'.xlings.workspace]
"xim:android-platform" = "36-r2"
