# What the HuxerUI test suites share under mcpp, as CMake's
# huxerui_add_test_suite() gives every suite: the vendored Catch2, the builtin
# resource package tests/support/builtin_resources.cpp opens, and the
# windowless testing library (testing/, CMake's HuxerUI::testing).
#
# WHY THE SUITES ARE PACKAGES. The repository's `tests/` is CMake's -- 111
# files, some driven by CMake or Python, some linking the CLI -- and mcpp builds
# every object of a package into every one of its programs. CMake builds one
# executable per suite, so each suite is a package of its own below (unit,
# runtime, ui, smoke), its sources named where they live, one program each.
#
# WHY THE SOURCES REACH UPWARD. The test files are not copied here. They are
# the same files `ctest` compiles, and a copy is the drift the rest of this
# directory exists to prevent.
[package]
name        = "huxerui-tests"
namespace   = "huxerui"
version     = "0.3.0"
standard    = "c++20"
description = "What the HuxerUI test suites share under mcpp"
license     = "MIT"

# The framework as CMake's own tree builds it for its tests: with profiling.
[dependencies]
huxerui.huxerui = { path = "../..", features = ["profiling"] }

[targets.huxerui-tests]
kind = "lib"

[build]
# Catch2 is the amalgamated copy this repository vendors, not the index's: the
# tests include <catch2/catch_amalgamated.hpp>, and a different Catch2 here would
# be a second version of the framework's test dependency.
sources = [
    "../../3dparty/catch2/src/catch_amalgamated.cpp",
    "../../tests/support/builtin_resources.cpp",
    "../../testing/ui_test.cpp",
    "../../testing/testing_platform_adapter.cpp",
    "../../testing/ui_snapshot.cpp",
]
include_dirs = [
    "../../3dparty/catch2/include",
    "../../3dparty/catch2/include/catch2",
    "../../tests/support",
    "../../testing",
    "../../src",
]
# The framework's implementation headers, which the testing library reaches as
# CMake's PRIVATE include does; every suite names them for itself.
private_include_dirs = ["../../src"]
defines = ["CATCH_AMALGAMATED_CUSTOM_MAIN=ON"]

# Not a suite: the suites are the packages below.
[test]
discover = []
