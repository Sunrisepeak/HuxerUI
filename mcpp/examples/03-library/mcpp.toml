# c++23, and it is a workaround rather than a language requirement.
#
# The module unit writes `import std;`, which every implementation this project
# builds with supports at c++20 -- the MSVC STL's named modules are documented
# as needing /std:c++20 or later. But mcpp's clang-on-Windows path hardcodes
# `importStdMinLevel = 23` instead of probing the STL it found
# (mcpp-community/mcpp#603), and refuses the build below c++23.
#
# A module graph has exactly one standard, so this compiles huxerui at c++23
# too. Change this line back to c++20 once #603 is fixed.
[package]
name        = "huxerui-example-library"
version     = "0.1.0"
standard    = "c++23"
platforms = ["linux", "windows", "macos", "ios", "android", "emscripten"]
description = "An application importing a HuxerUI component library"

# Two edges, and only one of them is named by this application's own code.
# `widgets` is what it imports; `huxerui` is here because the application uses
# HuxerUI directly too -- a dependency's dependency is not importable.
[dependencies]
huxerui        = { path = "../../.." }
example-widgets = { path = "widgets" }

[targets.huxerui_example_library]
# `app`, not `bin`: the thing a user launches, which every row supplies its own
# file for -- an executable on the desktop rows, a `.js` launcher on the Web,
# and on Android the shared object the Java host loads (mcpp 2026.9.12.3+).
kind = "app"
main = "src/main.cpp"
# The GUI subsystem, and the portable `int main()` that keeps it.
#
# Without this a double-clicked executable opens a console window behind the
# application. The keys are here rather than in the entry source because the
# correct linker flags depend on the ABI -- MSVC takes `/SUBSYSTEM:WINDOWS`
# with `/ENTRY:mainCRTStartup`, MinGW takes `-mwindows` -- and they reach this
# executable's link only, never the test binaries or a consumer. Requires
# mcpp 2026.9.12.2+. On Linux and macOS they render nothing and the artifact
# is byte-identical.
windows_subsystem = "windows"

[build]
ios_deployment_target = "15.0"
sources = []

# THE ARTIFACT'S EXCEPTION MODEL. Only a root manifest may state it, and
# HuxerUI requires it on the Web, where Emscripten's default is off; an
# application writes this section once.
[target.'cfg(os = "emscripten")'.abi]
exceptions = true

# The rows that run somewhere other than the build machine, and the program
# that gets the artifact there: `adb-run` from xim:android-platform-tools,
# `simctl-run` from xim:apple-simulator-tools. `mcpp run --target <row>
# --format apk|app` packages first and hands the runner the result.
[target.x86_64-linux-android]
min_api_level = 23
runner = ["adb-run"]
[target.aarch64-linux-android]
min_api_level = 23
[target.aarch64-ios-sim]
runner = ["simctl-run"]
