# c++20, the standard of HuxerUI and of the applications this library is built
# into.
[package]
name        = "example-widgets"
version     = "0.1.0"
standard    = "c++20"
description = "A HuxerUI component library, consumed as a module"

# The identity the framework's manifest declares, which the application uses
# too, so both edges name one package. A library states no linkage.
[dependencies]
huxerui.huxerui = { path = "../../../.." }

[targets.example-widgets]
kind = "lib"

# The module a consumer imports. A package name may contain characters a module
# name may not, so the file is named for the module it declares.
[lib]
path = "src/widgets.cppm"

[build]
sources = []
