# HuxerUI as a native mcpp package.
#
# Additive: nothing in the CMake build reads this file, and deleting it plus
# `build.mcpp` and `mcpp/` returns the repository to a CMake-only project.
# `docs/design/mcpp-build-system.md` is the design; `mcpp/README.md` is how to
# drive it.

[workspace]
# The packages `mcpp build --workspace` can build, and only those.
# huxerui-build-rules is absent on purpose: it imports mcpp, so it compiles only
# inside a build program's compile and a fan-out dies on it. huxerui-tools is
# present despite pinning c++23, which a member that declares the key keeps.
members = ["mcpp/huxerui-source-select", "mcpp/huxerui-tests",
           "mcpp/huxerui-tests/unit", "mcpp/huxerui-tests/runtime", "mcpp/huxerui-tests/ui",
           "mcpp/huxerui-tests/smoke", "mcpp/huxerui-tools",
           "tools/codegen", "tools/resource_compiler"]

[package]
name        = "huxerui"
namespace   = "huxerui"
version     = "0.3.0"
# The SDK ABI baseline. Do not raise it: mcpp applies the root standard to the
# whole module graph, so this is imposed on every consumer too.
standard    = "c++20"
description = "HuxerUI declarative cross-platform UI framework"
license     = "MIT"
repo        = "https://github.com/HuxerUI/HuxerUI"
# Every row the mcpp build serves. Android is `env = "android"` on `os =
# "linux"` and Web is `emscripten`, which is the spelling the cfg() selectors
# below already use.
platforms   = ["linux", "windows", "macos", "ios", "android", "emscripten"]

# This repository's `tests/` belongs to CMake; the mcpp suites are the packages
# under mcpp/huxerui-tests, so the framework package discovers none of its own.
[test]
discover = []

# The public module. It lives outside `src/` because `src/` is private
# implementation and this file is API.
[lib]
path = "modules/huxerui.cppm"

[targets.huxerui]
# Linked into the application on every row but Android, as CMake's
# `_huxerui_select_framework_target` prefers huxerui_static there.
kind = "lib"

# On Android the framework is its own libhuxerui.so, which HuxerUIView loads by
# name: the Gradle build passes -DHUXERUI_BUILD_SHARED=ON -DHUXERUI_BUILD_STATIC=OFF
# (platform/android/huxerui/build.gradle), and CMake refuses a static framework
# on that row. Stated here once, so an application writes one dependency line
# and cannot receive a static framework by accident: a consumer's
# `linkage = "static"` is warned about and stays shared (mcpp 2026.9.14.2+).
[target.'cfg(env = "android")'.targets.huxerui]
kind = "shared"

# Compile-time profiling (CMake's HUXERUI_ENABLE_PROFILING). Off unless asked
# for, as in every build CMake distributes -- the Android Gradle library, the
# iOS xcframework and the SDK archives pass OFF, and installing an SDK with it ON
# is refused -- because a profiling build records a detailed trace into
# ./traces from the first frame. The repository's tests and examples ask for it,
# as CMake's own tree builds them with the option's default, ON.
[features]
profiling = { defines = ["HUXERUI_ENABLE_PROFILING=1"], sources = ["src/runtime/profiling.cpp"] }

[build]
# Mirrors the core glob in cmake/HuxerUIBuild.cmake; `huxerui-build-check`
# asserts the two agree. modules/huxerui.cppm re-exports the public headers'
# names, so `import huxerui;` and `#include <huxerui/huxerui.h>` name the same
# entities -- compiling it here is what makes the module importable.
# profiling.cpp is the `profiling` feature's source, which takes it out of this
# glob unless the feature is active -- as CMake removes it when
# HUXERUI_ENABLE_PROFILING is OFF.
sources                 = ["src/*/*.cpp", "modules/huxerui.cppm"]
include_dirs            = ["include", "src"]
# `src` is implementation-only, as CMake's PRIVATE vs PUBLIC says.
private_include_dirs    = ["src"]
cxxflags                = ["-Wall", "-Wextra", "-Wpedantic"]
macos_deployment_target = "12.0"
# The iOS floor platforms.md states; carried by the effective triple on the
# iOS rows and ignored everywhere else.
ios_deployment_target   = "15.0"

# The exception model is a property of the whole artifact (clang records it in
# the BMI and refuses an importer that disagrees). Emscripten's default is off
# and HuxerUI validates with exceptions, so every Web root states
# `[target.'cfg(os = "emscripten")'.abi] exceptions = true` -- the templates
# do -- and this refuses one that does not (mcpp 2026.9.13.1+; older engines
# ignore it silently). No thread switch: nothing in the graph carries
# `-pthread`, and the payload glibc has pthread in libc.
[target.'cfg(os = "emscripten")']
requires_abi = { exceptions = true }

# BUILD-dependencies: none of these reaches the artifact. hcg and hrc run on the
# build machine and produce sources; the rule module is compiled into build.mcpp
# itself. `reexport` is what makes an application's manifest one line -- the
# tools and the rule module reach ITS build program without it naming them.
[build-dependencies]
huxerui.huxerui-codegen           = { path = "tools/codegen",           tools = ["hcg"], reexport = true }
huxerui.huxerui-resource-compiler = { path = "tools/resource_compiler", tools = ["hrc"], reexport = true }
huxerui.huxerui-build-rules       = { path = "mcpp/huxerui-build-rules", host-module = true, reexport = true }

# ---------------------------------------------------------------- Linux ----
# Sources mirror cmake/platform/Linux.cmake.
# `linux` alone would also be true for Android, which is `env = "android"` on
# `os = "linux"`; the GTK sources and the 37 GTK payloads below are for the
# desktop only, so every Linux section excludes that env.
[target.'cfg(all(linux, not(env = "android")))'.build]
sources = ["platform/linux/*.cpp"]
# The GTK stack comes from xlings, not the machine (mcpp compiles against its
# own glibc, and a host GTK's headers pull the host's <bits/time.h> into every
# core TU). The payload table lives once, in mcpp/huxerui-build-rules-gtk's
# manifest: a host module's declaration provisions the payloads and reaches
# every build program, this one included, so nothing is declared here.

# -------------------------------------------------------------- Windows ----
[target.windows.build]
# windows_installer.cpp is the Burn glue an application's installer interface
# compiles (cmake/HuxerUIWindowsInstaller.cmake; huxerui.rules' `bootstrapper`),
# not part of libhuxerui.
sources  = ["platform/windows/*.cpp", "!platform/windows/windows_installer.cpp"]
defines  = ["UNICODE", "_UNICODE", "NOMINMAX", "WIN32_LEAN_AND_MEAN",
            "WINVER=0x0A00", "_WIN32_WINNT=0x0A00"]
# NO MSVC-DIALECT FLAGS. mcpp builds Windows with clang targeting
# x86_64-windows-msvc -- the MSVC ABI and the Windows SDK, not MinGW -- and its
# GNU driver rejects `/W4` and friends. `[toolchain] windows = "msvc@system"`
# would put both build systems on one compiler and was tried; a host module's
# BMI then reaches cl.exe in clang's `name=path` spelling and the compile dies
# with C1083 (mcpp-community/mcpp#604). Retry when that is fixed.


[target.windows.runtime]
# The tail of this list -- kernel32, gdi32, winspool, uuid, comdlg32 -- is what
# CMAKE_CXX_STANDARD_LIBRARIES adds IMPLICITLY and mcpp does not. Omitting them
# surfaces at the link as `undefined symbol: CreateDIBSection`.
libraries = ["advapi32", "d2d1", "d3d11", "dwrite", "dwmapi", "dxguid", "dxgi",
             "imm32", "ole32", "oleaut32", "psapi", "shell32", "uiautomationcore",
             "user32", "winhttp", "windowscodecs",
             "dcomp", "windowsapp", "crypt32", "propsys",
             "kernel32", "gdi32", "winspool", "uuid", "comdlg32"]
# ---------------------------------------------------------------- macOS ----
[target.macos.build]
# `.mm` is a first-class source kind but is not in the default glob.
sources  = ["platform/macos/*.mm"]
cxxflags = ["-fobjc-arc"]
# `-weak_framework` has no neutral spelling; [runtime] frameworks covers only
# ordinary linkage.
ldflags  = ["-weak_framework", "UniformTypeIdentifiers"]

# The frameworks macOS and iOS share stay at the top level, rendered only for
# Mach-O; the ones that exist in one SDK and not the other -- AppKit is not in
# the iOS SDK, UIKit is not in the macOS one -- sit under their target's
# runtime table (mcpp 2026.9.12.3+), which appends to this list.
[runtime]
frameworks = ["AVFoundation", "CoreGraphics", "CoreImage", "CoreText", "CoreVideo",
              "Foundation", "ImageIO", "Metal", "MetalPerformanceShaders",
              "QuartzCore", "UserNotifications"]

# The platform floors CMake builds HuxerUI for (CMakeLists.txt, platforms.md):
# the engine states each row's value as a fact, and an application that targets
# less is refused before compiling, naming the key that set it. The value stays
# the application's own; nothing here raises it.
[[runtime.requirements]]
kind  = "version-floor"
value = "android.api-level >= 23"

[[runtime.requirements]]
kind  = "version-floor"
value = "ios.deployment-target >= 15.0"

[[runtime.requirements]]
kind  = "version-floor"
value = "macos.deployment-target >= 12.0"
[target.macos.runtime]
frameworks = ["AppKit", "Carbon"]

# ------------------------------------------------------------------ iOS ----
# Sources mirror cmake/platform/IOS.cmake. The deployment floor is
# `[build] ios_deployment_target` above; the simulator and device rows share
# everything here.
# The compiler runtime of the iOS rows is a graph package (mcpp 2026.9.13.2,
# docs/20): the payload's resource directory has no iOS builtins, and the
# framework's own `@available` checks call into them. Declared once here, every
# application inherits it.
#
# THE C++ STANDARD LIBRARY OF THE APPLE ROWS IS THE APPLICATION'S, NOT THIS
# PACKAGE'S. `llvm.libcxx` -- the libc++ an iOS program's objects match, and
# the one that keeps macOS at the application's own 12.0 floor -- compiles its
# sources only at c++23, and a module graph has one standard
# (mcpp-community/mcpp#641). Declared here it would raise every consumer's
# graph and this package's own c++20 root build with it, so the templates and
# the examples declare it beside their `standard`.
[target.'cfg(os = "ios")'.dependencies]
llvm.compiler-rt-builtins = "22.1.8.5"

[target.'cfg(os = "ios")'.build]
sources  = ["platform/ios/*.mm"]
cxxflags = ["-fobjc-arc"]
ldflags  = ["-weak_framework", "UniformTypeIdentifiers"]
[target.'cfg(os = "ios")'.runtime]
frameworks = ["CoreFoundation", "MobileCoreServices", "UIKit"]

# -------------------------------------------------------------- Android ----
# Sources mirror cmake/platform/Android.cmake. An application on this row is
# a shared object the Java host loads (`kind = "app"`); the JNI entry points
# live in these sources and are exported like every other ELF symbol.
[target.'cfg(env = "android")'.build]
sources = ["platform/android/huxerui/src/main/cpp/*.cpp"]
[target.'cfg(env = "android")'.runtime]
libraries = ["android", "EGL", "GLESv2", "log"]

# ------------------------------------------------------------------ Web ----
# Sources mirror cmake/platform/Web.cmake. `-fexceptions` is not here: it is
# the artifact's exception model, stated by the root as `abi.exceptions` and
# required above. The `--pre-js` files need absolute paths and come from
# build.mcpp; the resources are preloaded from there too.
[target.'cfg(os = "emscripten")'.build]
sources = ["platform/web/*.cpp"]
ldflags = ["--bind", "--no-entry", "-lidbfs.js",
           "-sMODULARIZE=1", "-sEXPORT_ES6=1", "-sEXPORT_NAME=createHuxerUIApp",
           "-sEXPORTED_RUNTIME_METHODS=stringToNewUTF8", "-sENVIRONMENT=web",
           "-sALLOW_MEMORY_GROWTH=1", "-sSTACK_SIZE=1048576", "-sNO_EXIT_RUNTIME=1"]
