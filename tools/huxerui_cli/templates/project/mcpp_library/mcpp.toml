[package]
name     = "@LIBRARY_RESOURCE_NAMESPACE@"
version  = "0.1.0"
standard = "c++23"

# The library's public identity. huxerui.rules derives the resource namespace from it the way the CMake
# declaration does, so both declarations project the same library. `name`, `id`, and `namespace` are the
# identity `huxerui platform add` gives to the platform packages it writes.
[package.metadata.huxerui]
library   = "@LIBRARY_PUBLIC_TARGET@"
resources = "resources"
name      = "@PROJECT_NAME@"
id        = "@PROJECT_ID@"
namespace = "@LIBRARY_NAMESPACE@"

@MCPP_DEPENDENCIES@

[targets.@LIBRARY_RESOURCE_NAMESPACE@]
kind = "lib"

[build]
# huxerui.rules selects the sources and transforms composables.
sources      = []
include_dirs = ["include"]
